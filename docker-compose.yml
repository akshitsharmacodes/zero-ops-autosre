version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: autosre_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-victim_db}
      POSTGRES_USER: ${POSTGRES_USER:-autosre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autosre_password}
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=64MB
      -c track_activities=on
      -c track_counts=on
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autosre_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosre -d victim_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  victim_service:
    build:
      context: ./victim_service
      dockerfile: Dockerfile
    container_name: autosre_victim_service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: victim_db
      POSTGRES_USER: autosre
      POSTGRES_PASSWORD: autosre_password
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autosre_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autosre_backend
    environment:
      AUTOSRE_MODE: cached
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: victim_db
      POSTGRES_USER: autosre
      POSTGRES_PASSWORD: autosre_password
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autosre_net

volumes:
  postgres_data:

networks:
  autosre_net:
    driver: bridge
